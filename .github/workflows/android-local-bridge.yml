name: Android Local Bridge APK

on:
  push:
    branches:
      - agent/local-whatsapp-bridge-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-local-bridge-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/phygital-release.jks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64_RAW: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD_RAW: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64_RAW" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_SIGNING_PASSWORD_RAW" || (echo "Missing ANDROID_SIGNING_PASSWORD" && exit 1)

      - name: Restore and normalize signing credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64_RAW: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD_RAW: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64_RAW" | tr -d '\r\n\t ' | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          CLEAN_PASSWORD=$(printf '%s' "$ANDROID_SIGNING_PASSWORD_RAW" | tr -d '\r\n')
          test -n "$CLEAN_PASSWORD"
          echo "::add-mask::$CLEAN_PASSWORD"
          printf 'ANDROID_SIGNING_PASSWORD=%s\n' "$CLEAN_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify keystore
        shell: bash
        run: |
          test -s "$ANDROID_KEYSTORE_PATH"
          test "$(wc -c < "$ANDROID_KEYSTORE_PATH")" = "4460" || (echo "Keystore size mismatch" && exit 1)
          test "$(sha256sum "$ANDROID_KEYSTORE_PATH" | cut -d' ' -f1)" = "018985093e7ccd63f3dc6b5854aca2c3bb87893b5c3b4ca7848e248ee8890f4f" || (echo "Keystore content mismatch" && exit 1)
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_SIGNING_PASSWORD" -alias phygital-release >/dev/null

      - name: Read app version
        shell: bash
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' mobile-android/app/build.gradle.kts | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' mobile-android/app/build.gradle.kts | head -1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-v$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build stable signed APK
        shell: bash
        run: gradle -p mobile-android :app:assembleDebug --no-daemon --stacktrace --info

      - name: Verify APK
        shell: bash
        run: |
          test -s mobile-android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs mobile-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK
        run: cp mobile-android/app/build/outputs/apk/debug/app-debug.apk phygital-bot-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phygital-bot-${{ env.VERSION_NAME }}
          path: phygital-bot-latest.apk

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Phygital Bot Android ${{ env.VERSION_NAME }}
          body: |
            version_code=${{ env.VERSION_CODE }}
            version_name=${{ env.VERSION_NAME }}
            transport=android_notification
            message=Versión 0.6.7: cliente OkHttp con DNS-over-HTTPS para corregir acceso a Render desde Android.
          files: phygital-bot-latest.apk
          make_latest: true
