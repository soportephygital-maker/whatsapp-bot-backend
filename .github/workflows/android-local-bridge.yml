name: Android Local Bridge APK

on:
  push:
    branches:
      - agent/local-whatsapp-bridge-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-local-bridge-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Read app version
        shell: bash
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' mobile-android/app/build.gradle.kts | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' mobile-android/app/build.gradle.kts | head -1)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-local-v$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Build APK
        run: gradle -p mobile-android assembleDebug
      - name: Prepare APK
        run: cp mobile-android/app/build/outputs/apk/debug/app-debug.apk phygital-bot-latest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: phygital-bot-${{ env.VERSION_NAME }}
          path: phygital-bot-latest.apk
      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Phygital Bot Local Bridge ${{ env.VERSION_NAME }}
          body: |
            version_code=${{ env.VERSION_CODE }}
            version_name=${{ env.VERSION_NAME }}
            transport=android_notification
            message=Actualización Phygital Bot sin Meta API. Requiere conceder Acceso a notificaciones en Android.
          files: phygital-bot-latest.apk
          make_latest: true
