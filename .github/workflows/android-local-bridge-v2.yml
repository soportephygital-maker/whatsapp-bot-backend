name: Android Local Bridge APK v2

on:
  push:
    branches:
      - agent/local-whatsapp-bridge-v2
    paths:
      - 'mobile-android/**'
      - '.github/workflows/android-local-bridge-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-local-whatsapp-bridge-apk-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/phygital-release.jks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64_RAW: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD_RAW: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64_RAW" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_SIGNING_PASSWORD_RAW" || (echo "Missing ANDROID_SIGNING_PASSWORD" && exit 1)

      - name: Restore signing credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64_RAW: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD_RAW: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64_RAW" | tr -d '\r\n\t ' | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          CLEAN_PASSWORD=$(printf '%s' "$ANDROID_SIGNING_PASSWORD_RAW" | tr -d '\r\n')
          test -n "$CLEAN_PASSWORD"
          echo "::add-mask::$CLEAN_PASSWORD"
          printf 'ANDROID_SIGNING_PASSWORD=%s\n' "$CLEAN_PASSWORD" >> "$GITHUB_ENV"

      - name: Read app version
        shell: bash
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' mobile-android/app/build.gradle.kts | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' mobile-android/app/build.gradle.kts | head -1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-v$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build signed APK
        shell: bash
        run: gradle -p mobile-android :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -s mobile-android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose mobile-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK
        run: cp mobile-android/app/build/outputs/apk/debug/app-debug.apk phygital-bot-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phygital-bot-${{ env.VERSION_NAME }}
          path: phygital-bot-latest.apk

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Phygital Bot Android ${{ env.VERSION_NAME }}
          body: |
            version_code=${{ env.VERSION_CODE }}
            version_name=${{ env.VERSION_NAME }}
            transport=android_notification
            message=Actualización del puente móvil Phygital Bot.
          files: phygital-bot-latest.apk
          make_latest: true
