name: Android APK

on:
  push:
    branches:
      - agent/android-dashboard-app
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        run: gradle -p mobile-android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: phygital-bot-debug-apk
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish stable in-app update
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' mobile-android/app/build.gradle.kts | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' mobile-android/app/build.gradle.kts | head -1)
          mkdir -p /tmp/phygital-mobile-release
          cp mobile-android/app/build/outputs/apk/debug/app-debug.apk /tmp/phygital-mobile-release/phygital-bot-latest.apk
          cat > /tmp/phygital-mobile-release/latest.json <<EOF
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}",
            "message": "Nueva versión disponible. Pulsa Instalar actualización desde Phygital Bot.",
            "apk_url": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-release/phygital-bot-latest.apk",
            "source_sha": "${GITHUB_SHA}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan mobile-release-build
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/phygital-mobile-release/phygital-bot-latest.apk ./phygital-bot-latest.apk
          cp /tmp/phygital-mobile-release/latest.json ./latest.json
          git add phygital-bot-latest.apk latest.json
          git commit -m "Publish Phygital Bot Android ${VERSION_NAME}"
          git push --force origin HEAD:refs/heads/mobile-release
