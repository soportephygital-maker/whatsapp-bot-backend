name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - agent/backend-v2-hardening
      - agent/company-tree-files-escalation
      - agent/local-whatsapp-bridge-v2

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
