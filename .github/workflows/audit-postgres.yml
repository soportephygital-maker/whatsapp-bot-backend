name: Revision 79 PostgreSQL
on:
  push:
    branches: [agent/local-whatsapp-bridge-v2]
    paths: [.github/workflows/audit-postgres.yml, maintenance/revision_79/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: phygital_audit
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: test-only-not-production
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+psycopg://audit:test-only-not-production@127.0.0.1:5432/phygital_audit
      JWT_SECRET: database-smoke-private-test-key-only-never-production
      BOOTSTRAP_ADMIN_PASSWORD: test-access-not-production
      BOOTSTRAP_ADMIN_USERNAME: admin
      MAIL_WORKER_ENABLED: 'false'
      AI_PROVIDER: retrieval
      WHATSAPP_SEND_ENABLED: 'false'
      AI_LEARNING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/apply_audit.py
      - run: python -m pip install -r requirements.txt
      - name: Verificar inicio autenticacion aprendizaje y cola sobre PostgreSQL
        shell: bash
        run: |
          mkdir -p audit-results
          python - <<'PY' | tee audit-results/postgres.txt
          from fastapi.testclient import TestClient
          from app.main import app
          from app.database import SessionLocal
          from app.models import Company, Conversation, SupportTicket, CaseEmailJob
          from app.services.case_event_notifications import send_case_event_email
          with TestClient(app) as client:
              assert client.get('/health/ready').status_code == 200
              auth = client.post('/api/auth/login', json={'username':'admin','password':'test-access-not-production'})
              assert auth.status_code == 200
              headers={'Authorization':'Bearer '+auth.json()['access_token']}
              with SessionLocal() as db:
                  co=Company(company_key='postgres_test', name='Empresa de prueba PostgreSQL');db.add(co);db.flush()
                  cv=Conversation(company_id=co.id, wa_user_id='ficticio', state='inicio');db.add(cv);db.flush()
                  t=SupportTicket(company_id=co.id, conversation_id=cv.id, description='Prueba');db.add(t);db.flush()
                  cid=co.id
                  send_case_event_email(db, ticket=t, event='human_required');db.commit()
                  assert db.query(CaseEmailJob).count() == 1
              r=client.post('/api/admin-ai/chat',headers=headers,json={'company_id':cid,'message':'Tema: prueba. Problema: equipo apagado. Procedimiento: Preguntar si tiene dano visible.'})
              assert r.status_code == 200, r.text
              point=r.json()['learning_point_id']
              assert client.patch('/api/admin-ai/learning/'+str(point),headers=headers,json={'status':'approved'}).status_code == 200
              assert client.get('/api/admin-ai/status',headers=headers).json()['approved_points'] == 1
              assert client.get('/api/analytics',headers=headers).status_code == 200
          print('PostgreSQL 16: inicio, readiness, login, tablas, aprendizaje, aprobacion, analitica y cola correctos.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision79-postgres
          path: audit-results/
          retention-days: 7
